name: Development environment
on:
  push:
    paths: ['.github/workflows/environment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve and record compatible dependencies
        run: |
          mkdir -p capsule/web capsule/wheels
          cd capsule/web
          npm init -y
          npm install --save-exact vue@3.5 pinia@3 element-plus@2 lucide-vue-next@0.468.0
          npm install --save-dev --save-exact vite@7 @vitejs/plugin-vue@6 typescript@5.9 vue-tsc@3 @playwright/test@1.55.1 @types/node@22
          npm ls --depth=0 > dependency-versions.txt
          npm audit --json > npm-audit.json || true
          cd ../..
          python -m pip download --dest capsule/wheels 'mcp>=1.20,<2' 'fastapi>=0.115,<1' 'pydantic>=2.10,<3' 'sqlalchemy>=2.0,<3' 'alembic>=1.15,<2' 'uvicorn>=0.34,<1' 'httpx>=0.28,<1' 'argon2-cffi>=23.1' 'pyyaml>=6,<7' 'pytest>=8,<10' 'pytest-cov>=6,<8' 'pytest-asyncio>=1,<2' 'ruff>=0.12,<1' 'pip-audit>=2,<3'
          tar -czf dependency-capsule.tgz capsule
      - uses: actions/upload-artifact@v4
        with:
          name: development-dependencies
          path: dependency-capsule.tgz
          retention-days: 3
