name: Restore verified source and run acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.restore.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore complete UTF-8 source
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PARENT: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, lzma, os, shutil, urllib.request
          from pathlib import Path, PurePosixPath
          payload = b"".join(Path(f".delivery/{i:02}.chunk").read_bytes() for i in range(11))
          assert hashlib.sha256(payload).hexdigest() == "7dae528d70354c7208c600c29fefdde760de7981970efec64aa7bdf826b6a5b4"
          source = json.loads(lzma.decompress(payload))
          assert isinstance(source, dict) and len(source) == 74
          for name, content in source.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and ".." not in path.parts
              assert path.parts[0] not in {".git", ".github", ".delivery", ".env", ".airlock", ".airlock-compose"}
              assert isinstance(content, str) and len(content.encode()) < 1000000
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          shutil.rmtree(".delivery")
          print("Restored 74 source files; archive SHA-256 verified.")
          def api(path, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  "https://api.github.com/repos/Changxin-YR/AIRLOCK/" + path,
                  data=data, method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = os.environ["SOURCE_PARENT"]
          base = api("git/commits/" + parent)["tree"]["sha"]
          entries = [{"path": name, "mode": "100644", "type": "blob", "content": content}
                     for name, content in source.items()]
          entries += [{"path": f".delivery/{i:02}.chunk", "mode": "100644", "type": "blob", "sha": None}
                      for i in range(11)]
          tree = api("git/trees", "POST", {"base_tree": base, "tree": entries})["sha"]
          commit = api("git/commits", "POST", {"message": "feat: implement AIRLOCK change review workbench",
                       "tree": tree, "parents": [parent]})["sha"]
          api("git/refs/heads/main", "PATCH", {"sha": commit, "force": False})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("commit=" + commit + "\n")
          print("Published checksum-verified source commit:", commit)
          PYCODE
  acceptance:
    needs: restore
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ needs.restore.outputs.commit }}
