name: Restore verified source and run acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.restore.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore complete UTF-8 source
        id: restore
        run: |
          python - <<'PYCODE'
          import hashlib, json, lzma, shutil
          from pathlib import Path, PurePosixPath
          payload = b"".join(Path(f".delivery/{i:02}.chunk").read_bytes() for i in range(11))
          assert hashlib.sha256(payload).hexdigest() == "7dae528d70354c7208c600c29fefdde760de7981970efec64aa7bdf826b6a5b4"
          source = json.loads(lzma.decompress(payload))
          assert isinstance(source, dict) and len(source) == 74
          for name, content in source.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and ".." not in path.parts
              assert path.parts[0] not in {".git", ".github", ".delivery", ".env", ".airlock", ".airlock-compose"}
              assert isinstance(content, str) and len(content.encode()) < 1000000
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          shutil.rmtree(".delivery")
          print("Restored 74 source files; archive SHA-256 verified.")
          PYCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: implement verified AIRLOCK change review workbench"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: restore
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ needs.restore.outputs.commit }}
