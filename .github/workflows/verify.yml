name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and inspect Python dependencies
        run: |
          mkdir -p Evidence/bootstrap/wheels
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > Evidence/bootstrap/python-resolved.txt
          python -m pip download -r requirements-dev.txt -d Evidence/bootstrap/wheels
          python -c "import mcp,fastapi,pydantic,sqlalchemy; import importlib.metadata as m; print({p:m.version(p) for p in ('mcp','fastapi','pydantic','sqlalchemy')})" | tee Evidence/bootstrap/python-imports.txt
      - name: Resolve frontend dependencies
        working-directory: apps/web
        run: |
          npm install --ignore-scripts
          npm ls --depth=0 > ../../Evidence/bootstrap/npm-resolved.txt
          cp package-lock.json ../../Evidence/bootstrap/package-lock.json
          tar -czf ../../Evidence/bootstrap/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-dependencies
          path: Evidence/bootstrap/
          retention-days: 7
