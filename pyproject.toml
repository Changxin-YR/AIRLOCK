[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-change-review"
version = "0.1.0"
description = "Evidence-bound approval and transactional execution for agent changes"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4", "sqlalchemy==2.0.50", "alembic==1.18.4", "httpx==0.28.1", "argon2-cffi==25.1.0", "PyYAML==6.0.3", "mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "pytest-asyncio==1.3.0", "ruff==0.16.9"]

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires a real external LLM credential", "browser: real Chromium integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"benchmark/evaluate.py" = ["E402"]
