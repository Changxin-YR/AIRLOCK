[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-approval-lab"
version = "0.1.0"
description = "A bounded, server-enforced SQL approval lab with snapshot-bound execution"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.4", "uvicorn==0.48.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "mcp==1.26.0"]
browser = ["playwright==1.57.0"]

[project.scripts]
airlock = "airlock.__main__:main"
airlock-mcp = "airlock.mcp:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.setuptools.package-data]
airlock = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
