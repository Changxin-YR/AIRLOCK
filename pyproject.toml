[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-change-review"
version = "0.1.0"
description = "Evidence-bound human approval and transactional execution for agent changes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.4", "sqlalchemy==2.0.50",
  "alembic==1.18.4", "uvicorn==0.48.0", "httpx==0.28.1",
  "argon2-cffi==25.1.0", "pyyaml==6.0.3", "mcp==1.30.0"
]

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
