[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-change-review"
version = "0.1.0"
description = "Evidence-bound change review for constrained agent database tools"
requires-python = ">=3.12"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.4", "SQLAlchemy==2.0.50", "httpx==0.28.1", "uvicorn==0.48.0", "PyYAML==6.0.3", "argon2-cffi==25.1.0", "alembic==1.18.4"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov==7.0.0", "alembic==1.18.4", "playwright>=1.56,<2"]

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live_model: requires explicitly supplied model credentials", "browser: real Chromium frontend integration", "mcp: official SDK stdio transport"]
asyncio_mode = "auto"
