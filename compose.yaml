name: airlock-review
x-hardened: &hardened
  image: airlock-review:local
  build: .
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=32m,mode=1777]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped
services:
  runner:
    <<: *hardened
    command: [python, -m, airlock.cli, runner, --host, 0.0.0.0, --port, '8090']
    env_file: runtime/compose/runner.env
    environment:
      AIRLOCK_TARGET_DB: /data/target.db
    volumes:
      - ./runtime/runner:/data
    networks: [execution]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    <<: *hardened
    command: [python, -m, airlock.cli, gateway, --host, 0.0.0.0, --port, '8080']
    env_file: runtime/compose/gateway.env
    environment:
      AIRLOCK_META_DB: /data/meta.db
      AIRLOCK_RUNNER_URL: http://runner:8090
      AIRLOCK_POLICY: /app/policies/default.yaml
      AIRLOCK_DIST: /app/apps/web/dist
      AIRLOCK_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      AIRLOCK_HOSTS: 127.0.0.1,localhost,gateway
    volumes:
      - ./runtime/gateway:/data
    ports: ["127.0.0.1:8080:8080"]
    networks: [frontend, execution]
    depends_on:
      runner: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  agent:
    <<: *hardened
    profiles: [agent]
    entrypoint: [python]
    command: [-m, airlock.mcp_server]
    stdin_open: true
    env_file: runtime/agent/.env
    environment:
      AIRLOCK_BASE_URL: http://gateway:8080
    # No target, metadata, credentials, Docker socket, or host volumes.
    networks: [frontend]
    restart: 'no'
networks:
  execution: {internal: true}
  frontend: {}
